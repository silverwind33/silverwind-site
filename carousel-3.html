<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Montserrat:wght@200;300;400&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card {
    width: 1080px; height: 1350px;
    position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    background: #0a0a0a;
  }
  .photo {
    position: absolute; inset: 0;
    background: url('https://images.unsplash.com/photo-1599379719561-2c7dbcc3b84a?w=1080&h=1350&fit=crop&crop=center&q=80') center/cover no-repeat;
    opacity: 0.55;
    filter: saturate(0.3) brightness(0.8) contrast(1.05);
  }
  .overlay {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 50% 45%, transparent 0%, rgba(0,0,0,0.45) 100%),
      linear-gradient(180deg, rgba(0,0,0,0.3) 0%, transparent 25%, transparent 75%, rgba(0,0,0,0.4) 100%);
  }
  .line {
    position: absolute; top: 95px; left: 50%; transform: translateX(-50%);
    width: 40px; height: 1px; background: rgba(255,255,255,0.2); z-index: 3;
  }
  .brand {
    position: absolute; top: 55px; left: 0; right: 0; text-align: center;
    font-family: 'Montserrat', sans-serif; font-weight: 300; font-size: 13px;
    color: rgba(255,255,255,0.45); letter-spacing: 10px; text-transform: uppercase; z-index: 3;
  }
  .text { position: relative; z-index: 2; text-align: center; padding: 90px; }
  .text h2 {
    font-family: 'Inter', sans-serif; font-weight: 500; font-size: 52px;
    line-height: 1.45; color: #fff;
    text-shadow: 0 4px 30px rgba(0,0,0,0.6);
  }
  .text p {
    font-family: 'Inter', sans-serif; font-weight: 400; font-size: 22px;
    line-height: 1.75; color: rgba(255,255,255,0.85); margin-top: 30px;
    text-shadow: 0 2px 15px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>
<div class="card">
  <div class="photo"></div>
  <div class="overlay"></div>
  <div class="brand">silverwind</div>
  <div class="line"></div>
  <div class="text">
    <h2>Ты не меняешь реальность<br>действиями.</h2>
    <p>Ты меняешь решение о том,<br>кто ты — и реальность<br>перестраивается под это.</p>
  </div>
</div>
<button onclick="savePNG()" style="position:fixed;top:20px;right:20px;z-index:999;padding:12px 28px;background:#fff;color:#000;border:none;border-radius:8px;font-size:16px;cursor:pointer;font-family:sans-serif;">Скачать PNG</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
function savePNG() {
  html2canvas(document.querySelector('.card'), {scale:1, useCORS:true, width:1080, height:1350}).then(c => {
    const a = document.createElement('a');
    a.download = 'carousel-3.png';
    a.href = c.toDataURL('image/png');
    a.click();
  });
}
</script>
</body>
</html>
