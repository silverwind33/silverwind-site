<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анкета — Silverwind</title>
    <script src="/tailwind.js"></script>
    <script>
        if (typeof tailwind !== 'undefined') {
            tailwind.config = { theme: { extend: { fontFamily: { display:['Unbounded','sans-serif'], body:['Inter','system-ui','sans-serif'] } } } }
        }
    </script>
    <link rel="preload" href="/fonts/fonts.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="/fonts/fonts.css"></noscript>
    <style>
        :root{--bg:#0A0A0A;--accent:#A8B4BE;--accent-soft:#C8D2DC}
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
        html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased}
        body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:#fff;overflow-x:hidden}

        .noise::before{content:'';position:fixed;inset:0;z-index:999;pointer-events:none;opacity:0.03;
            background:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:256px}

        @keyframes drift{from{transform:translateY(0)}to{transform:translateY(-2000px)}}
        .stars-global{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
        .s-layer{position:absolute;top:0;left:0;width:100%;height:2000px}
        .s1{animation:drift 70s linear infinite}.s2{animation:drift 140s linear infinite}.s3{animation:drift 200s linear infinite}
        .s-dot{position:absolute;border-radius:50%}

        @keyframes shinySlide{0%{background-position:200% center}100%{background-position:-200% center}}

        @keyframes enter{from{opacity:0;transform:translateY(32px)}to{opacity:1;transform:translateY(0)}}
        .enter{opacity:0;animation:enter 1.1s cubic-bezier(0.16,1,0.3,1) forwards}
        .e1{animation-delay:.05s}.e2{animation-delay:.18s}.e3{animation-delay:.3s}.e4{animation-delay:.44s}

        .section-line{height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.06),transparent)}

        #mobileMenu{display:none}#mobileMenu.open{display:flex}

        /* Form styles */
        .field-label{font-family:'Inter',sans-serif;font-size:13px;color:rgba(255,255,255,0.75);line-height:1.5;margin-bottom:10px;display:block}
        .field-sub{font-size:11px;color:rgba(168,180,190,0.45);margin-top:2px}

        textarea,input[type="text"]{
            width:100%;background:rgba(255,255,255,0.03);border:1px solid rgba(168,180,190,0.15);
            border-radius:10px;padding:12px 14px;color:#fff;font-family:'Inter',sans-serif;
            font-size:13px;resize:vertical;outline:none;transition:border-color .2s;
        }
        textarea:focus,input[type="text"]:focus{border-color:rgba(168,180,190,0.4)}
        textarea{min-height:90px}

        .radio-wrap{display:flex;flex-direction:column;gap:8px}
        .radio-option{display:flex;align-items:center;gap:10px;padding:11px 14px;
            background:rgba(255,255,255,0.02);border:1px solid rgba(168,180,190,0.1);
            border-radius:10px;cursor:pointer;transition:border-color .2s}
        .radio-option:hover{border-color:rgba(168,180,190,0.3)}
        .radio-option input{accent-color:#A8B4BE;width:15px;height:15px;flex-shrink:0}
        .radio-option span{font-family:'Inter',sans-serif;font-size:13px;color:rgba(255,255,255,0.8)}
        .radio-option:has(input:checked){border-color:rgba(168,180,190,0.5);background:rgba(168,180,190,0.06)}

        .consent-wrap{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;
            background:rgba(168,180,190,0.04);border:1px solid rgba(168,180,190,0.12);border-radius:10px;cursor:pointer}
        .consent-wrap input{accent-color:#A8B4BE;width:16px;height:16px;flex-shrink:0;margin-top:2px}
        .consent-wrap span{font-family:'Inter',sans-serif;font-size:12px;color:rgba(168,180,190,0.6);line-height:1.6}
        .consent-wrap a{color:rgba(168,180,190,0.8);text-decoration:underline}
    </style>
</head>
<body class="noise">
<div class="stars-global" id="starsGlobal"></div>

<!-- HEADER -->
<header class="sticky top-0 z-50 h-[62px]" style="background:rgba(10,10,10,0.92);backdrop-filter:blur(14px);border-bottom:1px solid rgba(168,180,190,0.07)">
    <div class="max-w-6xl mx-auto px-6 md:px-10 h-full grid items-center" style="grid-template-columns:1fr auto 1fr">
        <a href="index.html" class="font-display font-light text-[11px] tracking-[0.22em] uppercase text-[var(--accent)] justify-self-start">Silverwind</a>
        <nav class="hidden md:flex items-center gap-4">
            <a href="about.html"   class="font-display font-light text-[10px] tracking-[0.14em] uppercase text-white/28 hover:text-white/70 transition-colors whitespace-nowrap">Кто я?</a>
            <a href="urok.html"    class="font-display font-light text-[10px] tracking-[0.14em] uppercase text-white/25 hover:text-white/70 transition-colors duration-300 whitespace-nowrap">Урок</a>
            <a href="index.html"   class="font-display font-light text-[10px] tracking-[0.14em] uppercase text-white/28 hover:text-white/70 transition-colors whitespace-nowrap">Курс</a>
            <a href="club.html"    class="font-display font-light text-[10px] tracking-[0.14em] uppercase text-white/28 hover:text-white/70 transition-colors whitespace-nowrap">Клуб</a>
            <a href="bot.html"     class="font-display font-light text-[10px] tracking-[0.14em] uppercase text-white/28 hover:text-white/70 transition-colors whitespace-nowrap">AI Бот</a>
            <a href="reviews.html" class="font-display font-light text-[10px] tracking-[0.14em] uppercase text-white/28 hover:text-white/70 transition-colors whitespace-nowrap">Отзывы</a>
        </nav>
        <div class="hidden md:flex items-center gap-4 justify-self-end">
            <a href="course/login.html" class="font-display font-light text-[10px] tracking-[0.14em] uppercase text-white/28 hover:text-white/60 transition-colors">Войти</a>
            <a href="index.html#tariffs" class="font-display font-light text-[10px] tracking-[0.12em] uppercase px-6 py-2.5 rounded-full" style="background:linear-gradient(135deg,#A8B4BE 0%,#d0d8de 60%,#A8B4BE 100%);color:#0e1318;border:1px solid rgba(168,180,190,0.4)">Занять место</a>
        </div>
        <button class="md:hidden justify-self-end flex flex-col gap-[5px] p-2" onclick="document.getElementById('mobileMenu').classList.toggle('open')">
            <span class="w-5 h-px bg-white/40"></span><span class="w-5 h-px bg-white/40"></span><span class="w-5 h-px bg-white/40"></span>
        </button>
    </div>
</header>
<div id="mobileMenu" class="flex-col md:hidden sticky top-[62px] z-40 px-6 py-4 gap-4" style="background:rgba(10,10,10,0.97);border-bottom:1px solid rgba(168,180,190,0.07)">
    <a href="about.html"   class="font-display text-[11px] tracking-[0.15em] uppercase text-white/30">Кто я?</a>
    <a href="urok.html"    class="font-display font-light text-[10px] tracking-[0.14em] uppercase text-white/25">Урок</a>
    <a href="index.html"   class="font-display text-[11px] tracking-[0.15em] uppercase text-white/30">Курс</a>
    <a href="club.html"    class="font-display text-[11px] tracking-[0.15em] uppercase text-white/30">Клуб</a>
    <a href="bot.html"     class="font-display text-[11px] tracking-[0.15em] uppercase text-white/30">AI Бот</a>
    <a href="reviews.html" class="font-display text-[11px] tracking-[0.15em] uppercase text-white/30">Отзывы</a>
    <a href="course/login.html" class="font-display text-[11px] tracking-[0.15em] uppercase text-white/30">Войти</a>
</div>

<main class="relative z-10 max-w-3xl mx-auto px-6 md:px-10">

    <!-- HERO -->
    <section class="pt-16 md:pt-24 pb-10">
        <p class="font-display font-light text-[10px] tracking-[0.28em] uppercase mb-4 enter e1" style="color:var(--accent)">Бесплатно</p>
        <h1 class="font-display font-bold uppercase enter e2"
            style="font-size:clamp(1.6rem,3.5vw,2.4rem);letter-spacing:0.04em;line-height:1.1;margin-bottom:16px;color:#fff">
            Ответы на вопросы
        </h1>
        <p class="enter e3" style="font-size:14px;color:rgba(168,180,190,0.55);line-height:1.8;max-width:500px">
            После отправки вы получите вводный урок — подарок за ваши ответы
        </p>
    </section>

    <div class="section-line mb-10"></div>

    <!-- FORM -->
    <form id="anketaForm"
          style="display:flex;flex-direction:column;gap:28px;padding-bottom:80px">

        <!-- Consent -->
        <label class="consent-wrap enter e4">
            <input type="checkbox" name="consent" required>
            <span>Отвечая на вопросы и отправляя форму, вы даёте согласие на обработку персональных данных в соответствии с <a href="/privacy-policy.html" target="_blank">Политикой конфиденциальности</a></span>
        </label>

        <!-- Откуда вы -->
        <div>
            <label class="field-label">Откуда вы? <span class="field-sub">Страна, город</span></label>
            <input type="text" name="откуда" required placeholder="Москва, Россия">
        </div>

        <!-- Возраст -->
        <div>
            <label class="field-label">Сколько вам лет?</label>
            <div class="radio-wrap">
                <label class="radio-option"><input type="radio" name="возраст" value="Меньше 18" required><span>Меньше 18 лет</span></label>
                <label class="radio-option"><input type="radio" name="возраст" value="18-24"><span>18–24</span></label>
                <label class="radio-option"><input type="radio" name="возраст" value="25-31"><span>25–31</span></label>
                <label class="radio-option"><input type="radio" name="возраст" value="32-36"><span>32–36</span></label>
                <label class="radio-option"><input type="radio" name="возраст" value="Больше 37"><span>Больше 37</span></label>
            </div>
        </div>

        <!-- Запрос -->
        <div>
            <label class="field-label">Какой у вас сейчас основной запрос? <span class="field-sub">Опишите коротко или детально</span></label>
            <textarea name="запрос" required placeholder="Деньги, отношения, реализация..."></textarea>
        </div>

        <!-- Чему научиться -->
        <div>
            <label class="field-label">Есть то, чему бы вы хотели научиться у меня — в какой теме / жизненном опыте спросили бы совет?</label>
            <textarea name="научиться" required></textarea>
        </div>

        <!-- Блог -->
        <div>
            <label class="field-label">Чего не хватает в блоге для большего доверия ко мне? Какой информации / контента?</label>
            <textarea name="блог" required></textarea>
        </div>

        <!-- Подруге -->
        <div>
            <label class="field-label">Если бы вам нужно было рассказать подруге кто я и о чём мой блог, что бы вы сказали?</label>
            <textarea name="подруге" required></textarea>
        </div>

        <!-- Формат -->
        <div>
            <label class="field-label">Какой формат взаимодействия со мной вы бы выбрали? Что откликается больше?</label>
            <textarea name="формат" required placeholder="Личная работа, групповое, курс..."></textarea>
        </div>

        <!-- Telegram -->
        <div>
            <label class="field-label">Оставьте ник или ссылку на свой Telegram <span class="field-sub">Туда отправим подарок</span></label>
            <input type="text" name="telegram" required placeholder="@username или t.me/username">
        </div>

        <div class="section-line"></div>

        <p style="font-size:12px;color:rgba(168,180,190,0.4);line-height:1.7;text-align:center">Спасибо за ваши ответы — для меня это очень ценно.<br>После отправки вы получите урок.</p>

        <button type="submit" id="submitBtn"
                class="font-display font-bold uppercase text-center px-10 py-4 rounded-full inline-block w-full"
                style="font-size:13px;letter-spacing:0.12em;background:linear-gradient(135deg,#A8B4BE 0%,#d0d8de 60%,#A8B4BE 100%);color:#0e1318;border:1px solid rgba(168,180,190,0.4);cursor:pointer;transition:opacity .2s">
            Отправить и получить урок
        </button>
    </form>
    <script>
    document.getElementById('anketaForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.textContent = 'Отправляем...';
        btn.disabled = true;
        btn.style.opacity = '0.6';

        const formData = new FormData(this);
        const params = new URLSearchParams(formData);

        const GAS_URL = 'https://script.google.com/macros/s/AKfycbzJ4jyin3D80eqFIZw2zf5O8OL62DPvDUQ_sEkRtfp3DC9M_F0MLktDibJrP_vfjF5jcg/exec';
        try {
            await fetch(GAS_URL, {
                method: 'POST',
                body: params,
                mode: 'no-cors'
            });
        } catch(err) {}
        window.location.href = '/spasibo.html';
    });
    </script>

</main>

<script>
    const sg = document.getElementById('starsGlobal');
    [[200,'s1'],[120,'s2'],[60,'s3']].forEach(([count,cls]) => {
        const l = document.createElement('div'); l.className=`s-layer ${cls}`;
        for(let j=0;j<count;j++){const d=document.createElement('div');d.className='s-dot';const sz=Math.random()<.15?2:1;d.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;background:rgba(255,255,255,${.07+Math.random()*.3})`;l.appendChild(d)}
        sg.appendChild(l);
    });
</script>
</body>
</html>
