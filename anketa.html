<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ответы на вопросы — Silverwind</title>
    <script src="/tailwind.js"></script>
    <script>
        if (typeof tailwind !== 'undefined') {
            tailwind.config = { theme: { extend: { fontFamily: { display:['Unbounded','sans-serif'], body:['Inter','system-ui','sans-serif'] } } } }
        }
    </script>
    <link rel="preload" href="/fonts/fonts.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="/fonts/fonts.css"></noscript>
    <style>
        :root{--bg:#0A0A0A;--accent:#A8B4BE}
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:#fff;min-height:100vh}

        .field-label{font-family:'Inter',sans-serif;font-size:13px;color:rgba(255,255,255,0.75);line-height:1.5;margin-bottom:10px;display:block}
        .field-sub{font-size:11px;color:rgba(168,180,190,0.45);margin-top:2px}

        textarea,input[type="text"]{
            width:100%;background:rgba(255,255,255,0.03);border:1px solid rgba(168,180,190,0.15);
            border-radius:10px;padding:12px 14px;color:#fff;font-family:'Inter',sans-serif;
            font-size:13px;resize:vertical;outline:none;transition:border-color .2s;
        }
        textarea:focus,input[type="text"]:focus{border-color:rgba(168,180,190,0.4)}
        textarea{min-height:90px}

        .radio-wrap{display:flex;flex-direction:column;gap:8px}
        .radio-option{display:flex;align-items:center;gap:10px;padding:11px 14px;
            background:rgba(255,255,255,0.02);border:1px solid rgba(168,180,190,0.1);
            border-radius:10px;cursor:pointer;transition:border-color .2s}
        .radio-option:hover{border-color:rgba(168,180,190,0.3)}
        .radio-option input{accent-color:#A8B4BE;width:15px;height:15px;flex-shrink:0}
        .radio-option span{font-family:'Inter',sans-serif;font-size:13px;color:rgba(255,255,255,0.8)}
        .radio-option:has(input:checked){border-color:rgba(168,180,190,0.5);background:rgba(168,180,190,0.06)}

        .consent-wrap{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;
            background:rgba(168,180,190,0.04);border:1px solid rgba(168,180,190,0.12);border-radius:10px;cursor:pointer}
        .consent-wrap input{accent-color:#A8B4BE;width:16px;height:16px;flex-shrink:0;margin-top:2px}
        .consent-wrap span{font-family:'Inter',sans-serif;font-size:12px;color:rgba(168,180,190,0.6);line-height:1.6}
        .consent-wrap a{color:rgba(168,180,190,0.8);text-decoration:underline}

        .submit-btn{
            display:inline-block;font-family:'Unbounded',sans-serif;font-weight:700;
            font-size:12px;letter-spacing:0.12em;text-transform:uppercase;
            background:linear-gradient(135deg,#A8B4BE 0%,#d0d8de 60%,#A8B4BE 100%);
            color:#0e1318;border:none;border-radius:100px;padding:16px 40px;
            cursor:pointer;transition:opacity .2s;width:100%;margin-top:8px;
        }
        .submit-btn:hover{opacity:0.9}
        .submit-btn:disabled{opacity:0.5;cursor:not-allowed}

        .divider{height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.06),transparent);margin:8px 0}
    </style>
</head>
<body>

<!-- NAV -->
<nav style="padding:20px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(168,180,190,0.06)">
    <a href="/" style="font-family:'Unbounded',sans-serif;font-size:11px;letter-spacing:0.2em;color:rgba(255,255,255,0.6);text-decoration:none">SILVERWIND</a>
</nav>

<!-- FORM -->
<div style="max-width:560px;margin:0 auto;padding:48px 24px 80px">

    <p style="font-family:'Unbounded',sans-serif;font-size:10px;letter-spacing:0.25em;text-transform:uppercase;color:var(--accent);margin-bottom:16px">Бесплатно</p>
    <h1 style="font-family:'Unbounded',sans-serif;font-size:clamp(1.4rem,3vw,2rem);font-weight:800;text-transform:uppercase;letter-spacing:0.04em;line-height:1.1;margin-bottom:10px">Ответы на вопросы</h1>
    <p style="font-size:13px;color:rgba(168,180,190,0.55);line-height:1.7;margin-bottom:40px">После отправки вы получите вводный урок из курса по управлению реальностью</p>

    <div class="divider"></div>

    <form name="anketa" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="/spasibo.html" style="display:flex;flex-direction:column;gap:24px;margin-top:32px">
        <input type="hidden" name="form-name" value="anketa">
        <input name="bot-field" type="hidden">

        <!-- Consent -->
        <label class="consent-wrap">
            <input type="checkbox" name="consent" required>
            <span>Отвечая на вопросы и отправляя форму, вы даёте согласие на обработку персональных данных в соответствии с <a href="/privacy-policy.html" target="_blank">Политикой конфиденциальности</a></span>
        </label>

        <!-- Откуда вы -->
        <div>
            <label class="field-label">Откуда вы? <span class="field-sub">Страна, город</span></label>
            <input type="text" name="откуда" required placeholder="Москва, Россия">
        </div>

        <!-- Возраст -->
        <div>
            <label class="field-label">Сколько вам лет?</label>
            <div class="radio-wrap">
                <label class="radio-option"><input type="radio" name="возраст" value="Меньше 18" required><span>Меньше 18 лет</span></label>
                <label class="radio-option"><input type="radio" name="возраст" value="18-24"><span>18–24</span></label>
                <label class="radio-option"><input type="radio" name="возраст" value="25-31"><span>25–31</span></label>
                <label class="radio-option"><input type="radio" name="возраст" value="32-36"><span>32–36</span></label>
                <label class="radio-option"><input type="radio" name="возраст" value="Больше 37"><span>Больше 37</span></label>
            </div>
        </div>

        <!-- Запрос -->
        <div>
            <label class="field-label">Какой у вас сейчас основной запрос? <span class="field-sub">Опишите коротко или детально</span></label>
            <textarea name="запрос" required placeholder="Деньги, отношения, реализация..."></textarea>
        </div>

        <!-- Чему научиться -->
        <div>
            <label class="field-label">Есть то, чему бы вы хотели научиться у меня — в какой теме / жизненном опыте спросили бы совет?</label>
            <textarea name="научиться" required></textarea>
        </div>

        <!-- Блог -->
        <div>
            <label class="field-label">Чего не хватает в блоге для большего доверия ко мне? Какой информации / контента?</label>
            <textarea name="блог" required></textarea>
        </div>

        <!-- Подруге -->
        <div>
            <label class="field-label">Если бы вам нужно было рассказать подруге кто я и о чём мой блог, что бы вы сказали?</label>
            <textarea name="подруге" required></textarea>
        </div>

        <!-- Формат -->
        <div>
            <label class="field-label">Какой формат взаимодействия со мной вы бы выбрали? Что откликается больше?</label>
            <div class="radio-wrap">
                <label class="radio-option"><input type="radio" name="формат" value="Личная работа 1 на 1" required><span>Личная работа 1 на 1</span></label>
                <label class="radio-option"><input type="radio" name="формат" value="Групповое сопровождение"><span>Групповое сопровождение</span></label>
                <label class="radio-option"><input type="radio" name="формат" value="Курс без обратной связи"><span>Курс без обратной связи</span></label>
            </div>
        </div>

        <div class="divider"></div>

        <p style="font-size:12px;color:rgba(168,180,190,0.4);line-height:1.7;text-align:center">Спасибо за ваши ответы — для меня это очень ценно.<br>После отправки вы получите урок.</p>

        <button type="submit" class="submit-btn">Отправить и получить урок</button>
    </form>
</div>

</body>
</html>
