<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Эмблема Silverwind</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300;1,400&family=Montserrat:wght@200;300&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 40px;
      flex-wrap: wrap;
      padding: 40px;
    }

    /* Обёртка — круг */
    .emblem-wrap {
      position: relative;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
    }

    canvas {
      position: absolute;
      top: 0; left: 0;
      border-radius: 50%;
    }

    .emblem-content {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
    }

    /* Тонкое кольцо */
    .ring {
      position: absolute;
      inset: 28px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .ring-inner {
      position: absolute;
      inset: 38px;
      border-radius: 50%;
      border: 1px solid rgba(137,230,216,0.08);
    }

    /* Буква S */
    .letter {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: 220px;
      line-height: 1;
      background: linear-gradient(
        150deg,
        #ffffff 0%,
        #c8c8c8 25%,
        #f5f5f5 45%,
        #a0a0a0 65%,
        #e8e8e8 100%
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-top: 16px;
    }

    /* Маленькая подпись */
    .sub {
      font-family: 'Montserrat', sans-serif;
      font-weight: 200;
      font-size: 11px;
      letter-spacing: 7px;
      text-transform: uppercase;
      color: rgba(137,230,216,0.55);
      margin-top: -8px;
    }

    /* Звёздочка сверху */
    .star-top {
      font-size: 14px;
      color: rgba(137,230,216,0.5);
      margin-bottom: 8px;
      letter-spacing: 2px;
    }

    /* Превью маленького размера */
    .preview-label {
      color: rgba(255,255,255,0.3);
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-align: center;
      margin-top: 12px;
    }
    .preview-small {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      overflow: hidden;
      position: relative;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

<!-- БОЛЬШОЙ — для скриншота -->
<div>
  <div class="emblem-wrap" id="mainEmblem">
    <canvas id="c" width="500" height="500"></canvas>
    <div class="ring"></div>
    <div class="ring-inner"></div>
    <div class="emblem-content">
      <div class="star-top">✦</div>
      <div class="letter">S</div>
      <div class="sub">ilverwind</div>
    </div>
  </div>
  <p class="preview-label">500 × 500 · для аватарки</p>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 500, H = 500;

// Маска-круг
ctx.save();
ctx.beginPath();
ctx.arc(W/2, H/2, W/2, 0, Math.PI*2);
ctx.clip();

const small = Array.from({ length: 300 }, () => ({
  x: Math.random() * W, y: Math.random() * H,
  r: Math.random() * 0.7 + 0.15,
  a: Math.random() * 0.5 + 0.08,
  ph: Math.random() * Math.PI * 2,
  sp: Math.random() * 0.009 + 0.002
}));

const big = Array.from({ length: 12 }, () => ({
  x: Math.random() * W, y: Math.random() * H,
  r: Math.random() * 1.4 + 0.8,
  ph: Math.random() * Math.PI * 2,
  sp: Math.random() * 0.004 + 0.001
}));

function draw() {
  ctx.save();
  ctx.beginPath();
  ctx.arc(W/2, H/2, W/2, 0, Math.PI*2);
  ctx.clip();

  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, W, H);

  // Центральное свечение
  const fog = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, 260);
  fog.addColorStop(0,   'rgba(18,28,26,0.35)');
  fog.addColorStop(0.5, 'rgba(8,14,12,0.12)');
  fog.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = fog;
  ctx.fillRect(0, 0, W, H);

  for (const s of small) {
    s.ph += s.sp;
    const a = s.a * (0.4 + Math.sin(s.ph) * 0.6);
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    ctx.fill();
  }

  for (const s of big) {
    s.ph += s.sp;
    const a = 0.2 + Math.sin(s.ph) * 0.35;
    const glow = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 7);
    glow.addColorStop(0, `rgba(200,235,230,${a * 0.4})`);
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r * 7, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    ctx.fill();
  }

  ctx.restore();
  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
