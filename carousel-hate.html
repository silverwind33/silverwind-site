<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card {
    width: 1080px; height: 1350px;
    position: relative; overflow: hidden;
    background: #08080e;
  }
  .photo {
    position: absolute; top: 0; left: 0; right: 0;
    height: 810px;
    background: url('universe2.jpg') center top/cover no-repeat;
  }
  .fade {
    position: absolute; top: 600px; left: 0; right: 0; height: 210px;
    background: linear-gradient(180deg, transparent, #08080e);
  }
  .stars {
    position: absolute; inset: 0; z-index: 0;
    background:
      radial-gradient(1.2px 1.2px at 100px 900px, #fff, transparent),
      radial-gradient(1px 1px at 250px 950px, #fff, transparent),
      radial-gradient(1.5px 1.5px at 400px 880px, #fff, transparent),
      radial-gradient(1px 1px at 550px 1000px, #fff, transparent),
      radial-gradient(1px 1px at 700px 920px, #fff, transparent),
      radial-gradient(1.2px 1.2px at 850px 870px, #fff, transparent),
      radial-gradient(1px 1px at 980px 960px, #fff, transparent),
      radial-gradient(1px 1px at 150px 1100px, #fff, transparent),
      radial-gradient(1.5px 1.5px at 350px 1080px, #fff, transparent),
      radial-gradient(1px 1px at 500px 1150px, #fff, transparent),
      radial-gradient(1px 1px at 650px 1050px, #fff, transparent),
      radial-gradient(1.2px 1.2px at 800px 1120px, #fff, transparent),
      radial-gradient(1px 1px at 950px 1200px, #fff, transparent),
      radial-gradient(0.8px 0.8px at 200px 1000px, rgba(255,255,255,0.4), transparent),
      radial-gradient(0.8px 0.8px at 450px 1050px, rgba(255,255,255,0.4), transparent),
      radial-gradient(0.8px 0.8px at 600px 1180px, rgba(255,255,255,0.4), transparent),
      radial-gradient(0.8px 0.8px at 750px 1000px, rgba(255,255,255,0.4), transparent),
      radial-gradient(0.8px 0.8px at 900px 1080px, rgba(255,255,255,0.4), transparent),
      radial-gradient(0.8px 0.8px at 100px 1250px, rgba(255,255,255,0.4), transparent),
      radial-gradient(0.8px 0.8px at 300px 1280px, rgba(255,255,255,0.4), transparent),
      radial-gradient(0.8px 0.8px at 550px 1300px, rgba(255,255,255,0.4), transparent),
      radial-gradient(0.8px 0.8px at 800px 1260px, rgba(255,255,255,0.4), transparent);
  }

  .content {
    position: absolute; bottom: 0; left: 0; right: 0;
    z-index: 2;
    padding: 0 80px 60px;
  }

  .title {
    font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 58px;
    color: #fff; text-align: center;
    margin-bottom: 50px;
    letter-spacing: 1px;
  }

  .block {
    margin-bottom: 30px;
  }
  .block-label {
    font-family: 'Inter', sans-serif; font-weight: 500; font-size: 12px;
    letter-spacing: 4px; text-transform: uppercase;
    color: rgba(255,255,255,0.35);
    margin-bottom: 10px;
  }
  .block-text {
    font-family: 'Cormorant Garamond', serif; font-weight: 400; font-size: 30px;
    line-height: 1.5; color: rgba(255,255,255,0.8);
    padding-left: 20px;
    border-left: 1px solid rgba(255,255,255,0.15);
  }

  .insight {
    text-align: center;
    margin-top: 40px;
    padding-top: 30px;
    border-top: 0.5px solid rgba(255,255,255,0.1);
  }
  .insight-text {
    font-family: 'Cormorant Garamond', serif; font-weight: 400; font-size: 26px;
    font-style: italic;
    color: rgba(180,160,220,0.8);
    line-height: 1.5;
  }

  .bottom {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 35px;
  }
  .brand {
    font-family: 'Inter', sans-serif; font-weight: 300; font-size: 11px;
    color: rgba(255,255,255,0.2); letter-spacing: 8px; text-transform: uppercase;
  }
  .swipe {
    font-family: 'Inter', sans-serif; font-weight: 400; font-size: 13px;
    color: rgba(255,255,255,0.3); letter-spacing: 3px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="photo"></div>
  <div class="fade"></div>
  <div class="stars"></div>

  <div class="content">
    <div class="title">«Боюсь хейта»</div>

    <div class="block">
      <div class="block-label">Что ты думаешь</div>
      <div class="block-text">Люди злые, меня захейтят</div>
    </div>

    <div class="block">
      <div class="block-label">Что на самом деле</div>
      <div class="block-text">Ты боишься, что они скажут вслух то,<br>что ты сама о себе думаешь</div>
    </div>

    <div class="insight">
      <div class="insight-text">Это не про них. Это программа внутри.</div>
    </div>

    <div class="bottom">
      <span class="brand">silverwind</span>
      <span class="swipe">листай →</span>
    </div>
  </div>
</div>

<button onclick="savePNG()" style="position:fixed;top:20px;right:20px;z-index:999;padding:12px 28px;background:#fff;color:#000;border:none;border-radius:8px;font-size:16px;cursor:pointer;font-family:sans-serif;">Скачать PNG</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
function savePNG() {
  html2canvas(document.querySelector('.card'), {scale:1, useCORS:true, width:1080, height:1350}).then(c => {
    const a = document.createElement('a');
    a.download = 'carousel-hate.png';
    a.href = c.toDataURL('image/png');
    a.click();
  });
}
</script>
</body>
</html>
