<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Блок 1</title>
<link rel="stylesheet" href="fonts/local-fonts.css">
<style>
  @font-face {
    font-family: 'Manrope';
    font-style: normal;
    font-weight: 800;
    src: url('fonts/manrope-800.ttf') format('truetype');
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #08080a; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    width: 1280px; height: 720px;
    position: relative;
    overflow: hidden;
  }
  .glow {
    position: absolute; border-radius: 50%;
    filter: blur(60px); pointer-events: none;
  }
  .glow-1 { width: 420px; height: 420px; left: -120px; bottom: -140px;
    background: radial-gradient(circle, rgba(120,150,140,0.16) 0%, rgba(120,150,140,0) 70%); }
  .glow-2 { width: 460px; height: 460px; right: -140px; top: -160px;
    background: radial-gradient(circle, rgba(80,80,90,0.14) 0%, rgba(80,80,90,0) 70%); }

  .stars { position: absolute; inset: 0; }
  .star { position: absolute; background: #ffffff; border-radius: 50%; }

  .content {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
  }
  .tick { width: 1px; height: 14px; background: rgba(168,155,196,0.55); margin-bottom: 10px; }
  .block-label {
    font-family: 'Unbounded', monospace, sans-serif; font-weight: 500; font-size: 19px;
    letter-spacing: 0.42em; color: #A8B4BE; text-transform: uppercase;
    padding-left: 0.42em;
  }
  .rule-top { width: 46px; height: 1px; background: rgba(168,155,196,0.4); margin: 18px 0 26px; }
  h1 {
    font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 82px;
    letter-spacing: -0.01em; line-height: 1;
    background: linear-gradient(120deg, #ffffff 0%, #ffffff 12%, #7c8288 30%, #eef1f2 45%, #ffffff 55%, #5f6469 72%, #ffffff 88%, #d5d9db 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .rule-bottom { width: 46px; height: 1px; background: rgba(255,255,255,0.18); margin: 28px 0 0; }
  .footer {
    position: absolute; left: 0; right: 0; bottom: 44px; text-align: center;
    font-family: 'Unbounded', sans-serif; font-size: 11px; letter-spacing: 0.28em;
    color: rgba(255,255,255,0.25); text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="glow glow-2"></div>
  <div class="stars" id="stars"></div>
  <div class="content">
    <div class="tick"></div>
    <div class="block-label">БЛОК 1</div>
    <div class="rule-top"></div>
    <h1>МИРОУСТРОЙСТВО</h1>
    <div class="rule-bottom"></div>
  </div>
  <script>
    const starsEl = document.getElementById('stars');
    const seed = [
      [58,132,1.6,0.7],[512,90,1.2,0.5],[930,64,1.4,0.6],[1108,140,1.8,0.8],
      [180,230,1.1,0.4],[350,205,1.3,0.55],[900,240,1.2,0.45],[1050,300,1.5,0.6],
      [60,400,1.3,0.5],[230,440,1.1,0.4],[520,460,1.6,0.65],[940,470,1.2,0.45],
      [1170,430,1.4,0.55],[120,560,1.2,0.4],[340,600,1.5,0.6],[620,580,1.1,0.35],
      [860,610,1.3,0.5],[1020,580,1.6,0.65],[1200,620,1.2,0.45],[40,650,1.1,0.35],
      [480,660,1.3,0.5],[760,50,1.5,0.6],[1230,220,1.1,0.4],[15,300,1.2,0.45],
      [400,30,1.3,0.5],[650,660,1.2,0.4],[1150,60,1.4,0.55],[280,120,1.1,0.35],
      [980,410,1.5,0.6],[210,330,1.2,0.45]
    ];
    seed.forEach(([x,y,s,o])=>{
      const d=document.createElement('div');
      d.className='star';
      d.style.left=x+'px'; d.style.top=y+'px';
      d.style.width=s+'px'; d.style.height=s+'px';
      d.style.opacity=o;
      starsEl.appendChild(d);
    });
    let rnd = 42;
    function rand(){ rnd = (rnd * 9301 + 49297) % 233280; return rnd / 233280; }
    for(let i=0;i<160;i++){
      const d=document.createElement('div');
      d.className='star';
      const s = 0.6 + rand()*1.3;
      d.style.left=(rand()*1280)+'px'; d.style.top=(rand()*720)+'px';
      d.style.width=s+'px'; d.style.height=s+'px';
      d.style.opacity=(0.25 + rand()*0.5).toFixed(2);
      starsEl.appendChild(d);
    }
  </script>
</body>
</html>
