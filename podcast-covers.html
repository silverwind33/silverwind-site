<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Подкасты Silverwind</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { background:#0a0a0a; width:1080px; height:fit-content; line-height:0; }

@keyframes drift { from{transform:translateY(0)} to{transform:translateY(-2000px)} }
@keyframes shinySlide { 0%{background-position:200% center} 100%{background-position:-200% center} }
@keyframes border-spin { to{transform:rotate(360deg)} }

.stars-bg { position:absolute; inset:0; z-index:0; pointer-events:none; overflow:hidden; border-radius:0; }
.s-layer { position:absolute; top:0; left:0; width:100%; height:200%; }
.s1 { animation:drift 70s linear infinite; }
.s2 { animation:drift 140s linear infinite; }
.s-dot { position:absolute; border-radius:50%; }

.card {
  width: 1080px;
  background: linear-gradient(155deg, #0b0b0b 0%, #0d0d0d 60%, #0a0a0a 100%);
  border: 1px solid rgba(137,230,216,0.1);
  padding: 72px 72px 72px;
  position: relative;
  overflow: hidden;
  display: block;
}

.card::after {
  content:'';
  position:absolute;
  top:-60px; left:50%; transform:translateX(-50%);
  width:600px; height:200px;
  background:radial-gradient(ellipse, rgba(137,230,216,0.07) 0%, transparent 70%);
  pointer-events:none; z-index:1;
}

.card-content { position:relative; z-index:2; }

.heading {
  font-family:'Unbounded', sans-serif;
  font-size: 52px;
  font-weight: 800;
  line-height: 1.15;
  margin-bottom: 52px;
  text-transform: uppercase;
  letter-spacing: -0.01em;
  background: linear-gradient(90deg,
    rgba(255,255,255,0.25) 0%, rgba(255,255,255,0.25) 20%,
    rgba(255,255,255,0.65) 35%, #ffffff 44%,
    rgba(230,235,240,1) 50%, #ffffff 56%,
    rgba(255,255,255,0.65) 65%, rgba(255,255,255,0.25) 80%,
    rgba(255,255,255,0.25) 100%
  );
  background-size: 200% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: shinySlide 10s linear infinite;
}

.subtitle {
  font-family:'Unbounded', sans-serif;
  font-size: 15px;
  font-weight: 600;
  margin-top: -32px;
  margin-bottom: 48px;
  letter-spacing: 0.04em;
  line-height: 1;
}

.grid {
  columns: 3;
  column-gap: 20px;
}
.grid .photo-wrap {
  break-inside: avoid;
  margin-bottom: 16px;
  display: block;
}

.photo-wrap {
  border-radius: 16px;
  padding: 2px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 0 16px rgba(137,230,216,0.2), 0 0 40px rgba(137,230,216,0.08);
}
.photo-wrap::before {
  content:'';
  position:absolute;
  top:-100%; left:-100%; right:-100%; bottom:-100%;
  background: conic-gradient(from 0deg,
    transparent 0deg, transparent 130deg,
    rgba(137,230,216,0.7) 168deg,
    rgba(220,235,230,1) 180deg,
    rgba(137,230,216,0.7) 192deg,
    transparent 230deg, transparent 360deg);
  animation: border-spin 4s linear infinite;
  z-index:0;
}
.photo-wrap::after {
  content:'';
  position:absolute;
  inset:2px;
  background:#0a0a0a;
  border-radius:14px;
  z-index:1;
}
.photo-wrap img {
  position:relative; z-index:2;
  width:100%; height:auto;
  display:block;
  border-radius:14px;
}
</style>
</head>
<body>
<div class="card">
  <div class="stars-bg">
    <div class="s-layer s1" id="sl1"></div>
    <div class="s-layer s2" id="sl2"></div>
  </div>
  <div class="card-content">
    <div class="heading">200+ подкастов<br>по темам:</div>
    <div class="subtitle">
      <span style="color:#89E6D8;">Деньги</span>
      <span style="color:rgba(255,255,255,0.2);margin:0 12px;">·</span>
      <span style="color:#89E6D8;">Отношения</span>
      <span style="color:rgba(255,255,255,0.2);margin:0 12px;">·</span>
      <span style="color:#89E6D8;">Реализация</span>
      <span style="color:rgba(255,255,255,0.2);margin:0 12px;">·</span>
      <span style="color:#89E6D8;">Любовь к себе</span>
      <span style="color:rgba(255,255,255,0.2);margin:0 12px;">·</span>
      <span style="color:#89E6D8;">Манифестация</span>
    </div>
    <div class="grid">
      <div class="photo-wrap"><img src="obescenka.jpg" alt=""></div>
      <div class="photo-wrap"><img src="mat.jpg" alt=""></div>
      <div class="photo-wrap"><img src="sostoyanie.jpg" alt=""></div>
      <div class="photo-wrap"><img src="stradat.jpg" alt=""></div>
      <div class="photo-wrap"><img src="sotvorenie.jpg" alt=""></div>
      <div class="photo-wrap"><img src="ubezhdeniya.jpg" alt=""></div>
      <div class="photo-wrap"><img src="strahi.jpg" alt=""></div>
      <div class="photo-wrap"><img src="zhenshina.jpg" alt=""></div>
      <div class="photo-wrap"><img src="dostatochno.jpg" alt=""></div>
    </div>
  </div>
</div>

<script>
(function(){
  function makeStars(id, count, minS, maxS, minO, maxO){
    var l=document.getElementById(id), f=document.createDocumentFragment();
    for(var i=0;i<count;i++){
      var d=document.createElement('div'); d.className='s-dot';
      var s=minS+Math.random()*(maxS-minS), o=minO+Math.random()*(maxO-minO);
      d.style.cssText='width:'+s+'px;height:'+s+'px;top:'+(Math.random()*100)+'%;left:'+(Math.random()*100)+'%;background:rgba(255,255,255,'+o+');box-shadow:0 0 '+(s*2)+'px rgba(255,255,255,'+(o*0.5)+')';
      f.appendChild(d);
    }
    l.appendChild(f);
  }
  makeStars('sl1',120,0.8,2,0.15,0.55);
  makeStars('sl2',60,1.2,2.5,0.08,0.30);
})();
</script>
</body>
</html>
