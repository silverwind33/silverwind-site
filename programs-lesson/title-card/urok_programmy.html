<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Урок — Программы</title>
<link rel="stylesheet" href="fonts/local-fonts.css">
<style>
  @font-face {
    font-family: 'Manrope';
    font-style: normal;
    font-weight: 800;
    src: url('fonts/manrope-800.ttf') format('truetype');
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #08080a; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    width: 1600px; height: 1000px;
    position: relative;
    overflow: hidden;
  }
  .glow {
    position: absolute; border-radius: 50%;
    filter: blur(70px); pointer-events: none;
  }
  .glow-1 { width: 520px; height: 520px; left: -150px; bottom: -180px;
    background: radial-gradient(circle, rgba(120,150,140,0.16) 0%, rgba(120,150,140,0) 70%); }
  .glow-2 { width: 560px; height: 560px; right: -170px; top: -190px;
    background: radial-gradient(circle, rgba(80,80,90,0.14) 0%, rgba(80,80,90,0) 70%); }

  .stars { position: absolute; inset: 0; }
  .star { position: absolute; background: #ffffff; border-radius: 50%; }

  .content {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
  }
  .tick { width: 1px; height: 14px; background: rgba(168,155,196,0.55); margin-bottom: 10px; }
  .block-label {
    font-family: 'Unbounded', monospace, sans-serif; font-weight: 500; font-size: 19px;
    letter-spacing: 0.42em; color: #A8B4BE; text-transform: uppercase;
    padding-left: 0.42em;
  }
  .rule-top { width: 46px; height: 1px; background: rgba(168,155,196,0.4); margin: 18px 0 26px; }
  h1 {
    font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 58px;
    letter-spacing: -0.01em; line-height: 1;
    background: linear-gradient(120deg, #ffffff 0%, #ffffff 12%, #7c8288 30%, #eef1f2 45%, #ffffff 55%, #5f6469 72%, #ffffff 88%, #d5d9db 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .rule-bottom { width: 46px; height: 1px; background: rgba(255,255,255,0.18); margin: 28px 0 0; }

  .badges {
    position: absolute; right: 56px; bottom: 48px;
    display: flex; flex-direction: column; gap: 14px; align-items: flex-end;
  }
  .badge {
    display: flex; align-items: center; gap: 10px;
    font-family: 'Unbounded', sans-serif; font-weight: 500; font-size: 13px;
    letter-spacing: 0.08em; color: rgba(208,216,222,0.8); text-transform: uppercase;
  }
  .badge svg { flex-shrink: 0; }
</style>
</head>
<body>
  <div class="glow glow-2"></div>
  <div class="stars" id="stars"></div>
  <div class="content">
    <div class="tick"></div>
    <div class="block-label">УРОК</div>
    <div class="rule-top"></div>
    <h1>ПРОГРАММЫ</h1>
    <div class="rule-bottom"></div>
  </div>
  <div class="badges">
    <div class="badge">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <rect x="2" y="7" width="2" height="4" rx="1" fill="#A8B4BE"/>
        <rect x="6" y="4" width="2" height="10" rx="1" fill="#d0d8de"/>
        <rect x="10" y="1" width="2" height="16" rx="1" fill="#A8B4BE"/>
        <rect x="14" y="5" width="2" height="8" rx="1" fill="#d0d8de"/>
      </svg>
      Аудио · MP3 запись
    </div>
    <div class="badge">
      <svg width="16" height="18" viewBox="0 0 16 18" fill="none">
        <path d="M2 1H10L14 5V17H2V1Z" stroke="#A8B4BE" stroke-width="1.3" stroke-linejoin="round"/>
        <path d="M10 1V5H14" stroke="#A8B4BE" stroke-width="1.3" stroke-linejoin="round"/>
        <text x="8" y="13" font-family="Inter, sans-serif" font-size="4.6" font-weight="600" fill="#d0d8de" text-anchor="middle">PDF</text>
      </svg>
      Конспект · PDF-презентация
    </div>
  </div>
  <script>
    const starsEl = document.getElementById('stars');
    let rnd = 42;
    function rand(){ rnd = (rnd * 9301 + 49297) % 233280; return rnd / 233280; }
    for(let i=0;i<220;i++){
      const d=document.createElement('div');
      d.className='star';
      const s = 0.6 + rand()*1.3;
      d.style.left=(rand()*1600)+'px'; d.style.top=(rand()*1000)+'px';
      d.style.width=s+'px'; d.style.height=s+'px';
      d.style.opacity=(0.25 + rand()*0.5).toFixed(2);
      starsEl.appendChild(d);
    }
  </script>
</body>
</html>
